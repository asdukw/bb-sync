name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同分支连推时只跑最新一次，跳过被取代的旧 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright type check
        run: uv run pyright

      - name: Pytest (unit + CLI e2e)
        # 全部离线：不登录、不下载、不起浏览器。
        # 覆盖 CLI 命令行契约、退出码语义、stdout/stderr 分流与配置读写，
        # 等价于此前手工执行的全量回归。
        run: uv run pytest -q

  install-smoke:
    name: install smoke (clean container)
    # 模拟裸机：干净容器里按 README 前置条件装好依赖，再从 GitHub 安装 bb-sync 并验证
    runs-on: ubuntu-latest
    container: python:3.12-slim
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - name: Install prerequisites (git + uv)
        run: |
          apt-get update -qq && apt-get install -y -qq git ca-certificates >/dev/null
          pip install --quiet uv

      - name: Install bb-sync
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv tool install .
          else
            uv tool install git+https://github.com/${{ github.repository }}
          fi

      - name: Put uv tool bin on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Smoke test
        run: |
          bb-sync --version
          # 注意：doctor 的诊断输出走 stderr（stdout 只留给 --json 的结构化结果），
          # 因此必须用 2>&1 才能把体检结果落进文件供 grep 断言。
          # 容器里没有 Node/浏览器，doctor 会报缺项（预期，退出码非 0），只断言基础项
          bb-sync doctor > doctor.txt 2>&1 || true
          grep -q "✓.*Python" doctor.txt
          grep -q "✓.*git" doctor.txt
          grep -q "✓.*网络" doctor.txt
          # CLI 结构断言：无参数出帮助且退出码 0
          bb-sync >/dev/null
          test $? -eq 0
          # 未知命令退出码 2（用法错误）。
          # 注意 GitHub Actions 的 run 默认 set -e，非零退出会立刻中断脚本，
          # 因此必须用 || true（或 if !）兜住，才能拿到 $? 做断言。
          rc=0
          bb-sync definitely-not-a-command >/dev/null 2>&1 || rc=$?
          test "$rc" -eq 2
          # --json 的 JSON 必须落在 stdout 且可被解析（诊断走 stderr 不污染）
          bb-sync --json doctor 2>/dev/null | python -c "import json,sys; json.load(sys.stdin)"
