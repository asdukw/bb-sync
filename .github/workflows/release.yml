name: Release

on:
  push:
    tags: ["v*"]

# contents: write 用于建 Release；id-token: write 供 PyPI 信任发布（OIDC）换取短期凭据，
# 不需要在仓库里存任何 PyPI token。
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify artifact version matches tag
        # 防止「tag 打了 v1.0.0，包里却是别的版本号」这种低级但致命的发布事故
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ls dist/
          test -f "dist/bb_sync-${TAG}-py3-none-any.whl" || {
            echo "::error::构建产物版本与 tag 不一致：期望 bb_sync-${TAG}-py3-none-any.whl"
            exit 1
          }
          echo "版本校验通过：${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

      # 发布到 PyPI：走 Trusted Publishing，凭 OIDC 换临时 token，无需任何长期密钥。
      # 前置条件：PyPI 上已为该仓库配置 pending publisher（见 README / 发布说明）。
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
