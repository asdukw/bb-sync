name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify artifact version matches tag
        # 防止「tag 打了 v1.0.0，包里却是别的版本号」这种低级但致命的发布事故
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ls dist/
          test -f "dist/bb_sync-${TAG}-py3-none-any.whl" || {
            echo "::error::构建产物版本与 tag 不一致：期望 bb_sync-${TAG}-py3-none-any.whl"
            exit 1
          }
          echo "版本校验通过：${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
