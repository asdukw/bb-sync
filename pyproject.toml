[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bb-sync"
version = "1.4.0"
description = "Blackboard 课程资源自动同步：登录 ADFS SSO，增量下载课件/作业/指导、公告与待办"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["blackboard", "scraper", "course", "sync", "adfs", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "click>=8.5.0",
    "keyring>=25.7.0",
    "playwright>=1.45",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/asdukw/bb-sync"
Repository = "https://github.com/asdukw/bb-sync"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[project.scripts]
bb-sync = "bb_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bb_sync"]

# ------------------------------------------------------------ 测试
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# 测试里也会 import bb_sync，把 src 加进 sys.path，免装即可跑
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:bb_sync.*"]

# ------------------------------------------------------------ 质量门禁
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["courses", ".steel", ".venv", ".workbuddy", ".browser-profile"]
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# E501 行长交给 formatter；SIM108 三元替换可读性见仁见智；
# B008 是 Typer 的标准写法（typer.Option 作为参数默认值），必须豁免
ignore = ["E501", "SIM108", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["bb_sync"]

[tool.pyright]
include = ["src", "scripts", "tests"]
exclude = ["courses", ".steel", ".venv", ".workbuddy", ".browser-profile"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
